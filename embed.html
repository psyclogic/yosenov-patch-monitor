<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOSENOV Game Updates</title><meta name="robots" content="index,follow">
  <link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/assets/styles.css?v=20260809-v14">
</head>
<body class="embed">
  <main class="shell embed-shell">
    <div class="embed-toolbar"><span id="embed-title">YOSENOV Game Updates</span><button class="icon-button small-theme" data-theme-toggle aria-label="Ganti tema">☾</button></div>
    <div class="metrics" id="embed-metrics" aria-label="Filter cepat berdasarkan status">
      <button type="button" class="metric metric-button active" data-metric-filter="all"><div class="metric-label">Total game</div><div class="metric-value" id="m-total">0</div><div class="metric-hint">Tampilkan semua</div></button>
      <button type="button" class="metric metric-button" data-metric-filter="game"><div class="metric-label">Game perlu update</div><div class="metric-value" id="m-game">0</div><div class="metric-hint">Lihat game tertinggal</div></button>
      <button type="button" class="metric metric-button" data-metric-filter="translation"><div class="metric-label">Terjemahan perlu update</div><div class="metric-value" id="m-translation">0</div><div class="metric-hint">Prioritas terjemahan</div></button>
      <button type="button" class="metric metric-button" data-metric-filter="ready"><div class="metric-label">Siap / sinkron</div><div class="metric-value" id="m-ready">0</div><div class="metric-hint">Sudah sesuai patch</div></button>
    </div>
    <section class="panel" id="embed-panel">
      <div class="toolbar" id="embed-filterbar"><div class="toolbar-group"><input id="search" class="input search" type="search" placeholder="Cari game"><select id="filter" class="select" aria-label="Filter status"><option value="all">Semua status</option><option value="translation">Terjemahan perlu update</option><option value="game">Game perlu update</option><option value="ready">Sudah sinkron</option></select><select id="sort" class="select" aria-label="Urutkan game"><option value="name-asc">Nama A–Z</option><option value="translation-newest">Terjemahan terbaru</option><option value="game-newest">Game terbaru ditambahkan</option></select></div><div id="last-sync" class="game-id">Memuat…</div></div>
      <div id="games" class="games"></div><div id="empty" class="empty hidden">Belum ada game.</div>
    </section>
  </main>
<script src="/assets/theme.js?v=20260809-v14" defer></script>
<script type="module" src="/assets/public.js?v=20260809-v14"></script>
<script src="/assets/scroll-nav.js?v=20260809-v14" defer></script>
</body>
</html>
