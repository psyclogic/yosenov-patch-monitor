<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOSENOV Diagnostics</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="/"><img src="/assets/logo.svg" alt="YOSENOV"></a><button class="icon-button" data-theme-toggle>☾</button></div></header><main class="shell" style="padding:32px 0"><section class="admin-section"><h1>YOSENOV Diagnostics</h1><p style="color:var(--muted)">Halaman ini memeriksa komponen dasar deployment tanpa meminta password.</p><div id="checks" class="admin-list"></div></section></main><script src="/assets/theme.js" defer></script><script type="module">
const out=document.querySelector('#checks');
const row=(name,ok,detail)=>`<article class="admin-item"><div style="font-size:28px">${ok?'✓':'!'}</div><div><h3>${name}</h3><p>${detail}</p></div></article>`;
async function check(){let html='';
html+=row('Theme script',true,'Tema lokal aktif dan tidak bergantung pada Firebase.');
try{const r=await fetch('/api/firebase-config',{cache:'no-store'}); const j=await r.json(); html+=row('Firebase Web Config',r.ok,j.configured?'Environment Variables lengkap.':(j.error||'Belum lengkap.'));}catch(e){html+=row('Firebase Web Config',false,e.message)}
try{const r=await fetch('/api/steam?appid=1796790',{cache:'no-store'}); const j=await r.json(); html+=row('Steam API',r.ok,r.ok?`${j.name||'App'} · build ${j.remoteBuildId||'belum terbaca'}`:(j.error||`HTTP ${r.status}`));}catch(e){html+=row('Steam API',false,e.message)}
out.innerHTML=html;} check();
</script></body></html>
